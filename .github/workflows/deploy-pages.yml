name: Deploy to GitHub Pages

on:
  push:
    branches: ["claude/airport-weather-map-ErLbM"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.set-url.outputs.url }}

    steps:
      - uses: actions/checkout@v4

      - name: Compute Pages URL
        id: set-url
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO="${{ github.event.repository.name }}"
          echo "url=https://${OWNER}.github.io/${REPO}/" >> $GITHUB_OUTPUT

      - name: Push to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          exclude_assets: '.github'

      - name: Configure GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          BODY='{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}'

          echo "==> Current Pages config:"
          gh api "repos/$REPO/pages" 2>&1 || echo "(Pages not yet enabled)"

          echo ""
          echo "==> Attempting to create Pages site (POST):"
          echo "$BODY" | gh api "repos/$REPO/pages" --method POST --input - 2>&1 || true

          echo ""
          echo "==> Attempting to update Pages source (PUT):"
          echo "$BODY" | gh api "repos/$REPO/pages" --method PUT --input - 2>&1 || true

          echo ""
          echo "==> Final Pages config:"
          gh api "repos/$REPO/pages" 2>&1

      - name: Summary
        run: |
          URL="${{ steps.set-url.outputs.url }}"
          echo "### GitHub Pages deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**$URL**" >> $GITHUB_STEP_SUMMARY
