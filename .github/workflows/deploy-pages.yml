name: Deploy to GitHub Pages

on:
  push:
    branches: ["claude/airport-weather-map-ErLbM"]
  workflow_dispatch:

jobs:
  # Job 1: open the github-pages environment so any branch can deploy
  setup-env:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      deployments: write
    steps:
      - name: Remove branch restriction from github-pages environment
        run: |
          HTTP=$(curl -s -o /tmp/env.json -w "%{http_code}" \
            -X PUT \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/environments/github-pages" \
            -d '{"deployment_branch_policy":{"protected_branches":false,"custom_branch_policies":false}}')
          echo "HTTP $HTTP"
          cat /tmp/env.json
          [ "$HTTP" -lt 300 ] || exit 1

  # Job 2: standard GitHub Actions Pages deployment
  deploy:
    needs: setup-env
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
