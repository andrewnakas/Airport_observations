name: Deploy to GitHub Pages

on:
  push:
    branches: ["claude/airport-weather-map-ErLbM"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.set-url.outputs.url }}

    steps:
      - uses: actions/checkout@v4

      - name: Compute Pages URL
        id: set-url
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO="${{ github.event.repository.name }}"
          echo "url=https://${OWNER}.github.io/${REPO}/" >> $GITHUB_OUTPUT

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          exclude_assets: '.github'

      - name: Summary
        run: |
          echo "### Deployed: ${{ steps.set-url.outputs.url }}" >> $GITHUB_STEP_SUMMARY
