name: Deploy to GitHub Pages

on:
  push:
    branches: ["claude/airport-weather-map-ErLbM"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.set-url.outputs.url }}

    steps:
      - uses: actions/checkout@v4

      - name: Compute Pages URL
        id: set-url
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO="${{ github.event.repository.name }}"
          echo "url=https://${OWNER}.github.io/${REPO}/" >> $GITHUB_OUTPUT

      - name: Push to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          exclude_assets: '.github'

      - name: Configure GitHub Pages (legacy/branch mode)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          LEGACY_BODY='{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}'

          echo "=== Current Pages state ==="
          CURRENT=$(gh api "repos/$REPO/pages" 2>&1) && echo "$CURRENT" || echo "(not configured)"

          BUILD_TYPE=$(echo "$CURRENT" | jq -r '.build_type // empty' 2>/dev/null || true)
          echo "Detected build_type: '${BUILD_TYPE:-none}'"

          if [ -z "$BUILD_TYPE" ]; then
            echo ""
            echo "=== Creating Pages site with legacy/branch mode ==="
            echo "$LEGACY_BODY" | gh api "repos/$REPO/pages" --method POST --input -

          elif [ "$BUILD_TYPE" = "workflow" ]; then
            echo ""
            echo "=== Pages is set to 'workflow' mode — switching to legacy/branch mode ==="
            echo "$LEGACY_BODY" | gh api "repos/$REPO/pages" --method PUT --input -

          else
            echo ""
            echo "=== Pages already in legacy mode — ensuring source is gh-pages ==="
            echo '{"source":{"branch":"gh-pages","path":"/"}}' | \
              gh api "repos/$REPO/pages" --method PUT --input -
          fi

          echo ""
          echo "=== Final Pages state ==="
          gh api "repos/$REPO/pages"

      - name: Summary
        run: |
          URL="${{ steps.set-url.outputs.url }}"
          echo "### Deployed: $URL" >> $GITHUB_STEP_SUMMARY
