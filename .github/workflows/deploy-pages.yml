name: Deploy to GitHub Pages

on:
  push:
    branches: ["claude/airport-weather-map-ErLbM"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.set-url.outputs.url }}

    steps:
      - uses: actions/checkout@v4

      - name: Compute Pages URL
        id: set-url
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO="${{ github.event.repository.name }}"
          echo "url=https://${OWNER}.github.io/${REPO}/" >> $GITHUB_OUTPUT

      - name: Push to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          exclude_assets: '.github'

      - name: Enable / update Pages source
        run: |
          for METHOD in POST PUT; do
            STATUS=$(curl -s -o /tmp/pages.json -w "%{http_code}" \
              -X "$METHOD" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/pages" \
              -d '{"source":{"branch":"gh-pages","path":"/"}}')
            echo "$METHOD -> $STATUS: $(cat /tmp/pages.json)"
          done

      - name: Summary
        run: |
          echo "### GitHub Pages deployed" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.set-url.outputs.url }}" >> $GITHUB_STEP_SUMMARY
