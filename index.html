<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Airport Observations</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; overflow: hidden; }

    #map { position: fixed; inset: 0; }

    /* ── Loading overlay ── */
    #loading {
      position: fixed; inset: 0;
      background: rgba(10, 20, 40, 0.88);
      display: flex; align-items: center; justify-content: center;
      z-index: 2000; color: white;
    }
    #loading-box {
      text-align: center;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 18px;
      padding: 44px 56px;
      max-width: 360px;
    }
    #loading h2 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
    #loading p  { font-size: 13px; opacity: 0.6; margin-bottom: 20px; }
    #loading-status { font-size: 13px; color: rgba(255,255,255,0.65); margin-top: 14px; min-height: 18px; }

    .spinner {
      width: 38px; height: 38px;
      border: 3px solid rgba(255,255,255,0.18);
      border-top-color: #60a5fa;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      margin: 0 auto 18px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Side panel ── */
    #panel {
      position: fixed; top: 12px; right: 12px;
      width: 370px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 6px 30px rgba(0,0,0,0.22);
      z-index: 1000;
      max-height: calc(100vh - 24px);
      display: none; flex-direction: column;
      overflow: hidden;
    }
    #panel.visible { display: flex; }

    #panel-header {
      padding: 16px 20px;
      background: linear-gradient(135deg, #1a3a5c 0%, #2563eb 100%);
      color: white;
      display: flex; justify-content: space-between; align-items: flex-start;
      flex-shrink: 0;
    }
    #panel-title    { font-size: 19px; font-weight: 700; }
    #panel-subtitle { font-size: 12px; opacity: 0.75; margin-top: 3px; }
    #panel-close {
      cursor: pointer; font-size: 18px; line-height: 1;
      opacity: 0.7; padding: 3px 7px; border-radius: 6px;
      transition: 0.15s;
    }
    #panel-close:hover { opacity: 1; background: rgba(255,255,255,0.2); }

    #panel-body { overflow-y: auto; padding: 16px; flex: 1; }

    .section-title {
      font-size: 11px; font-weight: 700;
      color: #6b7280; text-transform: uppercase; letter-spacing: 0.6px;
      margin: 18px 0 10px;
    }
    .section-title:first-child { margin-top: 0; }

    .chart-wrap { position: relative; height: 180px; }

    table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    th {
      background: #f3f4f6; padding: 8px 10px; text-align: left;
      font-size: 11px; font-weight: 600; color: #4b5563;
      text-transform: uppercase; letter-spacing: 0.4px;
      border-bottom: 2px solid #e5e7eb;
    }
    td { padding: 7px 10px; border-bottom: 1px solid #f0f0f0; color: #374151; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #f9fafb; }

    .loading-inner {
      text-align: center; padding: 48px 20px; color: #9ca3af;
    }
    .loading-inner .spinner {
      border-color: rgba(0,0,0,0.08);
      border-top-color: #2563eb;
    }

    /* ── Error toast ── */
    #error-toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: #dc2626; color: white;
      padding: 12px 22px; border-radius: 10px;
      z-index: 3000; display: none; font-size: 13px;
      box-shadow: 0 4px 16px rgba(220,38,38,0.35);
    }

    /* leaflet tooltip tweak */
    .leaflet-tooltip { font-size: 12px; }
  </style>
</head>
<body>

<div id="map"></div>

<div id="loading">
  <div id="loading-box">
    <div class="spinner"></div>
    <h2>Airport Observations</h2>
    <p>ASOS/AWOS stations via dynamical.org</p>
    <div id="loading-status">Initializing…</div>
  </div>
</div>

<div id="panel">
  <div id="panel-header">
    <div>
      <div id="panel-title">—</div>
      <div id="panel-subtitle"></div>
    </div>
    <span id="panel-close" title="Close">✕</span>
  </div>
  <div id="panel-body">
    <div class="loading-inner">
      <div class="spinner"></div>
      Loading observations…
    </div>
  </div>
</div>

<div id="error-toast"></div>

<!-- Leaflet + clustering -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

<script type="module">
import * as duckdb from 'https://cdn.jsdelivr.net/npm/@duckdb/duckdb-wasm@1.28.0/+esm';

const BASE = "https://data.source.coop/dynamical/asos-parquet";
const STATION_YEAR = 2025;   // full year → complete station list
const OBS_YEAR    = new Date().getFullYear();

// ── Map ──────────────────────────────────────────────────────────────────────
const map = L.map('map').setView([39, -98], 4);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> | Data: <a href="https://dynamical.org">dynamical.org</a>'
}).addTo(map);

const clusterGroup = L.markerClusterGroup({ chunkedLoading: true });
map.addLayer(clusterGroup);

// ── UI helpers ────────────────────────────────────────────────────────────────
const setStatus = msg => { document.getElementById('loading-status').textContent = msg; };
const hideLoading = ()  => { document.getElementById('loading').style.display = 'none'; };
const showToast  = msg  => {
  const el = document.getElementById('error-toast');
  el.textContent = msg; el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 6000);
};

let obsChart = null;

// ── DuckDB init ───────────────────────────────────────────────────────────────
async function initDuckDB() {
  setStatus('Initializing DuckDB WASM…');
  const bundles = duckdb.getJsDelivrBundles();
  const bundle  = await duckdb.selectBundle(bundles);

  const workerUrl = URL.createObjectURL(
    new Blob([`importScripts("${bundle.mainWorker}");`], { type: 'text/javascript' })
  );
  const worker = new Worker(workerUrl);
  const db = new duckdb.AsyncDuckDB(new duckdb.ConsoleLogger(duckdb.LogLevel.WARNING), worker);
  await db.instantiate(bundle.mainModule, bundle.pthreadWorker);
  URL.revokeObjectURL(workerUrl);

  const conn = await db.connect();
  setStatus('Loading HTTP filesystem extension…');
  try {
    await conn.query("LOAD httpfs;");
  } catch {
    await conn.query("INSTALL httpfs FROM core; LOAD httpfs;");
  }
  return conn;
}

// ── Fetch airport list ────────────────────────────────────────────────────────
async function fetchAirports(conn) {
  setStatus('Fetching station list from dynamical.org…');
  const url = `${BASE}/year=${STATION_YEAR}/data.parquet`;
  const res = await conn.query(`
    SELECT DISTINCT station, name, latitude, longitude, state
    FROM read_parquet('${url}', hive_partitioning := true)
    WHERE latitude  IS NOT NULL
      AND longitude IS NOT NULL
      AND station   IS NOT NULL
    ORDER BY station
  `);
  return res.toArray().map(r => ({
    station: r.station,
    name:    r.name,
    lat:     r.latitude,
    lon:     r.longitude,
    state:   r.state,
  }));
}

// ── Fetch observations for one station ───────────────────────────────────────
async function fetchObs(conn, station) {
  const url = `${BASE}/year=${OBS_YEAR}/data.parquet`;
  const s   = station.replace(/'/g, "''");
  const res = await conn.query(`
    SELECT valid, tmpf, dwpf, sknt, drct, p01i, vsby
    FROM read_parquet('${url}', hive_partitioning := true)
    WHERE station = '${s}'
    ORDER BY valid DESC
    LIMIT 168
  `);
  return res.toArray().map(r => ({
    valid: r.valid, tmpf: r.tmpf, dwpf: r.dwpf,
    sknt: r.sknt,  drct: r.drct, p01i: r.p01i, vsby: r.vsby,
  }));
}

// ── Render observation panel ──────────────────────────────────────────────────
function renderObs(station, name, state, observations) {
  const body = document.getElementById('panel-body');

  if (!observations.length) {
    body.innerHTML = `<div class="loading-inner" style="padding:48px 20px; color:#6b7280;">
      No observations found for ${OBS_YEAR}.</div>`;
    return;
  }

  // Chronological order for chart
  const chrono   = [...observations].reverse();
  const withTemp = chrono.filter(o => o.tmpf != null);

  const fmtTime = iso => {
    const d = new Date(iso);
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })
      + ' ' + d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
  };

  body.innerHTML = `
    <div class="section-title">Temperature &amp; Dewpoint — last 7 days</div>
    <div class="chart-wrap"><canvas id="obs-chart"></canvas></div>
    <div class="section-title">Recent Observations</div>
    <div id="obs-table-wrap"></div>
  `;

  // Chart
  if (obsChart) { obsChart.destroy(); obsChart = null; }
  obsChart = new Chart(document.getElementById('obs-chart'), {
    type: 'line',
    data: {
      labels: withTemp.map(o => fmtTime(o.valid)),
      datasets: [
        {
          label: 'Temp °F',
          data: withTemp.map(o => o.tmpf),
          borderColor: '#ef4444',
          backgroundColor: 'rgba(239,68,68,0.08)',
          borderWidth: 2, tension: 0.35, pointRadius: 0, fill: true,
        },
        {
          label: 'Dewpoint °F',
          data: withTemp.map(o => o.dwpf),
          borderColor: '#3b82f6',
          backgroundColor: 'rgba(59,130,246,0.06)',
          borderWidth: 2, tension: 0.35, pointRadius: 0, fill: true,
        },
      ],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: { legend: { labels: { boxWidth: 12, font: { size: 11 } } } },
      scales: {
        x: { ticks: { maxTicksLimit: 5, font: { size: 10 }, maxRotation: 0 } },
        y: { ticks: { font: { size: 10 } } },
      },
    },
  });

  // Table (most recent 24)
  const rows = observations.slice(0, 24).map(o => `
    <tr>
      <td>${o.valid ? fmtTime(o.valid) : '—'}</td>
      <td>${o.tmpf != null ? o.tmpf + '°F' : '—'}</td>
      <td>${o.sknt != null ? o.sknt + ' kt' + (o.drct != null ? ' / ' + o.drct + '°' : '') : '—'}</td>
      <td>${o.vsby != null ? o.vsby + ' mi' : '—'}</td>
      <td>${o.p01i != null ? o.p01i + '"' : '—'}</td>
    </tr>`).join('');

  document.getElementById('obs-table-wrap').innerHTML = `
    <table>
      <thead><tr>
        <th>Time</th><th>Temp</th><th>Wind</th><th>Visibility</th><th>Precip</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

// ── Open panel for a station ──────────────────────────────────────────────────
async function openStation(conn, airport) {
  const panel = document.getElementById('panel');
  panel.classList.add('visible');
  document.getElementById('panel-title').textContent    = airport.station;
  document.getElementById('panel-subtitle').textContent =
    [airport.name, airport.state].filter(Boolean).join(', ');
  document.getElementById('panel-body').innerHTML = `
    <div class="loading-inner">
      <div class="spinner"></div>Loading observations…
    </div>`;

  try {
    const obs = await fetchObs(conn, airport.station);
    renderObs(airport.station, airport.name, airport.state, obs);
  } catch (err) {
    document.getElementById('panel-body').innerHTML =
      `<div style="padding:20px;color:#dc2626;">Failed: ${err.message}</div>`;
  }
}

// ── Main ──────────────────────────────────────────────────────────────────────
(async () => {
  let conn;
  try {
    conn = await initDuckDB();
    const airports = await fetchAirports(conn);

    setStatus(`Rendering ${airports.length} stations…`);

    airports.forEach(a => {
      const marker = L.circleMarker([a.lat, a.lon], {
        radius: 5, fillColor: '#2563eb',
        color: 'white', weight: 1.5, fillOpacity: 0.82,
      });
      marker.bindTooltip(
        `<b>${a.station}</b>${a.name ? '<br>' + a.name : ''}`,
        { direction: 'top', offset: [0, -4] }
      );
      marker.on('click', () => openStation(conn, a));
      clusterGroup.addLayer(marker);
    });

    hideLoading();
  } catch (err) {
    console.error(err);
    setStatus('Error: ' + err.message);
    showToast('Failed to load airport data — check console for details.');
  }
})();

document.getElementById('panel-close').addEventListener('click', () => {
  document.getElementById('panel').classList.remove('visible');
});
</script>
</body>
</html>
